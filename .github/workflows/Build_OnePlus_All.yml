name: Build OnePlus All
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  
jobs:
  sm8650:
    uses: ./.github/workflows/kernel-sm8650.yml
    secrets: inherit
    with:
      CPU: "sm8650"
      CPUD: "pineapple"
      ANDROID_VERSION: "android14"
      KERNEL_VERSION: "6.1"
      KPM: "Off"
      lz4kd: "Off"
      bbr: "Off"
      proxy: "On"

  mt6989:
    uses: ./.github/workflows/kernel-mt6989.yml
    secrets: inherit
    with:
      CPU: "mt6989"
      CPUD: "none"
      ANDROID_VERSION: "android14"
      KERNEL_VERSION: "6.1"
      KPM: "Off"
      lz4kd: "Off"
      bbr: "Off"
      proxy: "Off" # MTK系列CPU跑的时候需关闭否则出现恶性Bug

  sm8550:
    uses: ./.github/workflows/kernel-sm8550.yml
    secrets: inherit
    with:
      CPU: "sm8550"
      CPUD: "kalama"
      ANDROID_VERSION: "android13"
      KERNEL_VERSION: "5.15"
      KPM: "Off"
      lz4kd: "On"
      bbr: "Off"
      proxy: "Off"
      
  sm8475:
    uses: ./.github/workflows/kernel-sm8475.yml
    secrets: inherit
    with:
      CPU: "sm8475"
      CPUD: "waipio"
      ANDROID_VERSION: "android12"
      KERNEL_VERSION: "5.10"
      KPM: "Off"
      lz4kd: "On"
      bbr: "Off"
      proxy: "Off"
      
