      CPU: "sm8550"
      ANDROID_VERSION: "android13"
      KERNEL_VERSION: "5.15"
      KPM: "Off"
      lz4kd: "On"
      bbr: "Off"
      bbg: "On"
      proxy: "Off"
      
  sm8475:
    uses: ./.github/workflows/kernel-sm8475.yml
    secrets: inherit
    with:
      CPU: "sm8475"
      ANDROID_VERSION: "android12"
      KERNEL_VERSION: "5.10"
      KPM: "Off"
      lz4kd: "On"
      bbr: "Off"
      bbg: "On"
      proxy: "Off"
      
