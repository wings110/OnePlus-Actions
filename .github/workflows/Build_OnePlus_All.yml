name: Build SukiSU Ultra All Kernel
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  
jobs:
  sm8750:
    uses: ./.github/workflows/kernel-sm8750.yml
    secrets: inherit
    with:
      CPU: "sm8750"
      ANDROID_VERSION: "android15"
      KERNEL_VERSION: "6.6"
      KPM: "Off"
      lz4kd: "Off"
      bbr: "Off"
      bbg: "On"
      proxy: "On"

  mt6991:
    uses: ./.github/workflows/kernel-mt6991.yml
    secrets: inherit
    with:
      CPU: "mt6991"
      ANDROID_VERSION: "android15"
